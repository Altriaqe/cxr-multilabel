# NIH 数据量扫描 —— 复用比赛训练管线（train.py）
#
# 与比赛配置的唯一差异：
#   arch        convnext_small → convnext_small.in12k_ft_in1k（云端缓存里只有这个 tag）
#   data.cache_size  768 → 576（NIH 缓存按 576 档链接）
#   train.epochs     6 → 4（4 个数据点 × 2 组，控制总时长）
#
# 用法：
#   export CXR_DATA_DIR=cxr_nih CXR_CACHE_DIR=data/cache_nih HF_HUB_OFFLINE=1
#   python train.py --config configs/scaling_nih_448.yaml --subset 2000 --run-name nih_A_2k

run_name: scaling_nih_448
seed: 45

data:
  cache_size: 576
  image_size: 448
  batch_size: 16
  eval_batch_size: 16
  num_workers: 4
  scale: [0.65, 1.0]
  rotate: 10.0
  jitter: 0.3
  erasing: 0.35
  crop_ratio: [0.85, 1.15]
  ra_ops: 2
  ra_mag: 7

model:
  arch: convnext_small.in12k_ft_in1k
  pretrained: true
  drop: 0.3
  drop_path: 0.1
  grad_checkpointing: false

train:
  epochs: 4
  lr: 0.00004
  weight_decay: 0.05
  grad_accum: 2
  grad_clip: 1.0
  warmup_epochs: 0.5
  amp: true
  amp_dtype: bf16
  val_fp32: false
  loss: bce
  pos_weight: false

eval:
  agg: mean
