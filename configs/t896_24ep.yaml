# 第八代：ConvNeXt-T@896，24 轮（跟着 S 的成功配方）
#
# ## 依据
# exp066（S@896，24 轮）→ 0.8134，比 12 轮版（0.8120）高 +0.0014。
# 说明轮数确实偏少。现在把同样的加长用在 T@896 上。
#
# ## 期望
#   现有组合（S12 + T12）= 0.8134（无平滑）
#   换成（S24 + T12）    = 0.8139  ← 已验证
#   若 T 也加长 →（S24 + T24）预期 0.8145 左右
#   + 患者平滑 ≈ 0.8171 → 线上约 78.0
#
# ## 成本
#   T 比 S 快约 1.6 倍：24 × 约 12 分钟 ≈ 4.8 小时

run_name: t896_24ep
seed: 170

data:
  cache_size: 896
  image_size: 896
  batch_size: 8
  eval_batch_size: 8
  num_workers: 8
  scale: [0.65, 1.0]
  rotate: 10.0
  jitter: 0.3
  erasing: 0.35
  crop_ratio: [0.85, 1.15]
  ra_ops: 2
  ra_mag: 7

model:
  arch: convnext_tiny.in12k_ft_in1k
  pretrained: true
  drop: 0.3
  drop_path: 0.1
  grad_checkpointing: true

train:
  epochs: 24
  lr: 0.00004
  weight_decay: 0.05
  grad_accum: 4
  grad_clip: 1.0
  warmup_epochs: 2.0
  amp: true
  amp_dtype: bf16
  val_fp32: false
  loss: bce
  pos_weight: false

  distill_alpha: 0.5
  distill_probs: outputs/preds/teacher2_train_probs.npy

eval:
  agg: mean
