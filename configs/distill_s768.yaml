# 蒸馏：教师（9 路集成）→ 学生（ConvNeXt-S@768）
#
# 目的：把集成的知识压进**单个模型**，从而满足
#   * 交付 ≤500MB / 每 study ≤100ms
#   * 提交的 CSV 必须能被交付包复现
#
# 前置：
#   1) python tools/make_teacher_logits.py --split train --member ... --out outputs/preds/teacher_train_probs.npy
#   2) 软标签顺序必须与 load_split('train') 一致（脚本已保证）
#
# 判据：学生 9类+TTA ≥ 0.806 就定它为交付模型（当前 S@768 = 0.8050）

run_name: distill_s768
seed: 42

data:
  cache_size: 768
  image_size: 768
  batch_size: 16
  eval_batch_size: 16
  num_workers: 8
  scale: [0.80, 1.0]
  rotate: 7.0
  jitter: 0.2
  erasing: 0.25

model:
  arch: convnext_small
  pretrained: true
  drop: 0.3
  drop_path: 0.1
  grad_checkpointing: false

train:
  epochs: 12
  lr: 0.00004
  weight_decay: 0.05
  grad_accum: 2
  grad_clip: 1.0
  warmup_epochs: 1.0
  amp: true
  amp_dtype: bf16
  val_fp32: false
  loss: bce
  pos_weight: false

  # 蒸馏：软标签权重 0.5（硬标签 0.5）
  distill_alpha: 0.5
  distill_probs: outputs/preds/teacher_train_probs.npy

eval:
  agg: mean
