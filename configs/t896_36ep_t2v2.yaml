# 第十代：T@896，36 轮，教师换成本代（24 轮版）
#
# ## 为什么还要跑
# exp067（T@896，24 轮）用的是**12 轮教师**的软标签。
# 等 exp068 验证了"24 轮教师"有效后，T 也应该用同一套 v2 软标签再训一次，
# 这样交付的双模型（S+T）才在同一条"长训练 + 长蒸馏"的轨道上。
#
# ## 轮数为什么是 36（文献依据）
# ① Born-Again Networks（Furlanello et al., ICML 2018）：迭代蒸馏可让学生超过教师。
# ② 蒸馏共识：学生日程应长于教师（软标签更丰富、拟合更慢）。
#    exp068 的 S 学生用 36 轮，T 也用 36 轮保持对称，集成时两者收敛程度一致。
#
# ## 与 exp067 的差别
#   软标签：teacher2_train_probs.npy（12 轮教师）→ teacher2v2_train_probs.npy（24 轮教师）
#   轮数：24 → 36，warmup 2 → 3
#
# ## 判据（对照 exp067 的 val）
#   ≥ exp067 + 0.001 → v2 教师对 T 也有效，用它
#   否则 → 用 exp067
#
# ## 成本
#   36 × 约 12 分钟 ≈ 7.2 小时（11-10 20:00 起 → 11-11 03:12 完成）

run_name: t896_36ep_v2
seed: 190

data:
  cache_size: 896
  image_size: 896
  batch_size: 8
  eval_batch_size: 8
  num_workers: 8
  scale: [0.65, 1.0]
  rotate: 10.0
  jitter: 0.3
  erasing: 0.35
  crop_ratio: [0.85, 1.15]
  ra_ops: 2
  ra_mag: 7

model:
  arch: convnext_tiny.in12k_ft_in1k
  pretrained: true
  drop: 0.3
  drop_path: 0.1
  grad_checkpointing: true

train:
  epochs: 36
  lr: 0.00004
  weight_decay: 0.05
  grad_accum: 4
  grad_clip: 1.0
  warmup_epochs: 3.0
  amp: true
  amp_dtype: bf16
  val_fp32: false
  loss: bce
  pos_weight: false

  distill_alpha: 0.5
  distill_probs: outputs/preds/teacher2v2_train_probs.npy

eval:
  agg: mean
