# 最终尝试：ConvNeXt-T@768 + 蒸馏 α=0.9 + 强增强（两个最强配方首次组合）
#
# ## 为什么是这个组合
# 单独看，这两个都是我们验证过的最强因子：
#   · α=0.9 软标签：单体 T@768 = 0.8049（α=0.5）→ α=0.9 时 0.8086（logit_mean 口径）
#   · 强增强 RandAugment：S@768 单体 0.8035 → 0.8083（+0.0048）
# 但两者**从未组合过**。α=0.9 提供"学什么"，强增强提供"怎么学"，理论上互补。
#
# ## 已知风险
# α=0.9 会让模型更贴近教师（9 路集成），强增强会拖慢收敛；
# 12 轮可能不够。所以 warmup 保持 1 轮，让高 LR 阶段更长。
#
# ## 判据
#   T09 单模型基线 = 0.8081（cost.py 口径）
#   ≥0.812 → 新交付模型，test 预期 77.6+
#   0.808–0.812 → 持平，看是否更适合交付（T 比 S 快）
#   <0.808 → 两个最强因子不叠加，放弃
#
# ## 成本
#   12 轮 × 约 7.5 分钟 ≈ 90 分钟

run_name: distill_t768_a09_aug
seed: 80

data:
  cache_size: 768
  image_size: 768
  batch_size: 16
  eval_batch_size: 16
  num_workers: 8
  scale: [0.65, 1.0]
  rotate: 10.0
  jitter: 0.3
  erasing: 0.35
  crop_ratio: [0.85, 1.15]
  ra_ops: 2
  ra_mag: 7

model:
  arch: convnext_tiny
  pretrained: true
  drop: 0.3
  drop_path: 0.1
  grad_checkpointing: false

train:
  epochs: 12
  lr: 0.00004
  weight_decay: 0.05
  grad_accum: 2
  grad_clip: 1.0
  warmup_epochs: 1.0
  amp: true
  amp_dtype: bf16
  val_fp32: false
  loss: bce
  pos_weight: false

  distill_alpha: 0.9
  distill_probs: outputs/preds/teacher_train_probs.npy

eval:
  agg: mean
