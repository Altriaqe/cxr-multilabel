# 【新主线】ConvNeXt-T@768，但换 ImageNet-22k 预训练（fb_in22k_ft_in1k）
#
# ## 依据（2025 medRxiv，[Pretraining Diversity and Clinical Metric Optimization
# ## Achieve SOTA on ChestX-ray14](https://www.medrxiv.org/content/10.1101/2025.10.25.25338784v1.full)）
#   「**预训练的多样性主导架构多样性**」
#   作者试了 8 个模型（ConvNeXt / ViT / EfficientNet）× 多分辨率，共 255 种集成组合，
#   最优是 **3 个 ConvNeXt 的预训练变体组合**：ImageNet-1K / ImageNet-21K / ImageNet-21K-384；
#   加入 5 个现代架构（ViT、EfficientNet）带来的提升为 **0**。
#
# ## 我们的盲区
#   本项目所有模型都用 `in12k_ft_in1k`（ImageNet-12k→1k）同一套预训练，
#   **从未试过 ImageNet-22k 预训练变体**。22k 的预训练数据量大一个量级，
#   特征上限更高，且与现有模型构成"预训练多样性"。
#
# ## 与 exp044 的唯一差异
#   arch: convnext_tiny.in12k_ft_in1k  →  convnext_tiny.fb_in22k_ft_in1k
#   其余（768、α=0.9、强增强、12 轮）完全一致 —— 单变量对比
#
# ## 判据
#   exp044（in12k）结果作为对照
#   ≥ +0.003 → 预训练差异有效，全线换 22k
#   持平     → 预训练数据量在本任务上不是瓶颈
#
# ## 成本
#   12 轮 × 约 7.5 分钟 ≈ 90 分钟

run_name: t768_in22k_a09_aug
seed: 81

data:
  cache_size: 768
  image_size: 768
  batch_size: 16
  eval_batch_size: 16
  num_workers: 8
  scale: [0.65, 1.0]
  rotate: 10.0
  jitter: 0.3
  erasing: 0.35
  crop_ratio: [0.85, 1.15]
  ra_ops: 2
  ra_mag: 7

model:
  arch: convnext_tiny.fb_in22k_ft_in1k
  pretrained: true
  drop: 0.3
  drop_path: 0.1
  grad_checkpointing: false

train:
  epochs: 12
  lr: 0.00004
  weight_decay: 0.05
  grad_accum: 2
  grad_clip: 1.0
  warmup_epochs: 1.0
  amp: true
  amp_dtype: bf16
  val_fp32: false
  loss: bce
  pos_weight: false

  distill_alpha: 0.9
  distill_probs: outputs/preds/teacher_train_probs.npy

eval:
  agg: mean
