# 蒸馏学生 #8：EfficientNet-B3@768（换家族，追"不同"）
#
# 依据（10-31 验证）：融合收益来自"架构差异"——S vs T 就值 +0.0015。
# 现有的成员全是 ConvNeXt / DenseNet / ResNet（都是"卷积+残差"家族），误差相关性高。
#
# EfficientNet-B3 用 MBConv + Squeeze-Excitation，感受野和通道交互方式完全不同，
# 而且只有 12M 参数、768 下延迟约 8–10ms，塞得进交付预算。
#
# 判据：4/5 模型融合 ≥0.8120 才算带来新东西（当前最好 0.8113）
# 成本：12 轮 × 约 10 分钟 ≈ 2 小时

run_name: distill_effb3_768
seed: 50

data:
  cache_size: 768
  image_size: 768
  batch_size: 16
  eval_batch_size: 16
  num_workers: 8
  scale: [0.65, 1.0]
  rotate: 10.0
  jitter: 0.3
  erasing: 0.35
  crop_ratio: [0.85, 1.15]
  ra_ops: 2
  ra_mag: 7

model:
  arch: efficientnet_b3
  pretrained: true
  drop: 0.3
  drop_path: 0.1
  grad_checkpointing: false

train:
  epochs: 12
  lr: 0.00004
  weight_decay: 0.05
  grad_accum: 2
  grad_clip: 1.0
  warmup_epochs: 1.0
  amp: true
  amp_dtype: bf16
  val_fp32: false
  loss: bce
  pos_weight: false

  distill_alpha: 0.5
  distill_probs: outputs/preds/teacher_train_probs.npy

eval:
  agg: mean
