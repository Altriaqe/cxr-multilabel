# 长训练实验：ConvNeXt-S@768 + 蒸馏 α=0.5 + 强增强，**30 轮**
#
# ## 为什么做这个
# 我们所有模型都只训 12 轮，曲线在 ep8–10 "见顶"。但 12 轮的 cosine 调度
# 本身就把 LR 压到 0 了 —— 模型没有机会走完高 LR 阶段。
# 排行榜头部是 82 分（反推 val ≈ 0.837），我们 0.8123，差 0.014。
# 最可能的差距就是**训练不充分**，这是唯一还没验证的大杠杆。
#
# ## 判据
#   12 轮基线（S_aug）：0.8083
#   ≥0.815 → 找到了症结，后面全部改长训练
#   0.810–0.815 → 有效但不够，加到 50 轮
#   <0.810 → 假设不成立，回到"多样性集成"路线
#
# ## 成本
#   30 轮 × 约 12 分钟 ≈ 6 小时（晚上跑，早上收）

run_name: long30_s768_a05_aug
seed: 60

data:
  cache_size: 768
  image_size: 768
  batch_size: 16
  eval_batch_size: 16
  num_workers: 8
  scale: [0.65, 1.0]
  rotate: 10.0
  jitter: 0.3
  erasing: 0.35
  crop_ratio: [0.85, 1.15]
  ra_ops: 2
  ra_mag: 7

model:
  arch: convnext_small
  pretrained: true
  drop: 0.3
  drop_path: 0.1
  grad_checkpointing: false

train:
  epochs: 30
  lr: 0.00004
  weight_decay: 0.05
  grad_accum: 2
  grad_clip: 1.0
  warmup_epochs: 2.0
  amp: true
  amp_dtype: bf16
  val_fp32: false
  loss: bce
  pos_weight: false

  distill_alpha: 0.5
  distill_probs: outputs/preds/teacher_train_probs.npy

eval:
  agg: mean
