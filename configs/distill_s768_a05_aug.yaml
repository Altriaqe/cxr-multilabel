# 蒸馏学生 #7：ConvNeXt-S@768，α=0.5 + 强增强（追求"不同"，不追求"更强"）
#
# 依据（10-31 实测）：
#   α=0.5 单体 0.8049 → 4 模型融合 0.8098
#   α=0.7 单体 0.8064（更强）→ 4 模型融合 0.8090（更差）
#   → 集成里"不同"比"更强"值钱。
#
# 这版用 S（架构不同）+ 强增强（Augment 不同）+ α=0.5（软标签比例不变），
# 目标是**最大化与其他成员的差异**，而不是冲单体峰值。
#
# 判据：4 模型融合 ≥0.8100 才有意义（当前最好 0.8098）

run_name: distill_s768_a05_aug
seed: 49

data:
  cache_size: 768
  image_size: 768
  batch_size: 16
  eval_batch_size: 16
  num_workers: 8
  scale: [0.65, 1.0]
  rotate: 10.0
  jitter: 0.3
  erasing: 0.35
  crop_ratio: [0.85, 1.15]
  ra_ops: 2
  ra_mag: 7

model:
  arch: convnext_small
  pretrained: true
  drop: 0.3
  drop_path: 0.1
  grad_checkpointing: false

train:
  epochs: 14
  lr: 0.00004
  weight_decay: 0.05
  grad_accum: 2
  grad_clip: 1.0
  warmup_epochs: 1.0
  amp: true
  amp_dtype: bf16
  val_fp32: false
  loss: bce
  pos_weight: false

  distill_alpha: 0.5
  distill_probs: outputs/preds/teacher_train_probs.npy

eval:
  agg: mean
