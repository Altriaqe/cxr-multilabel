# 蒸馏学生 #2：ConvNeXt-T@768（教师 = 9 路集成）
#
# 动机：学生 #1（S@768）进集成后 test +0.06，说明"继承集成判断但过拟合路径不同"
#       的模型互补性强。T@768 参数只有 S 的一半，速度 7 分钟/轮，84 分钟就能出一版。
#
# 前置：outputs/preds/teacher_train_probs.npy 已生成（10-30 08:55）

run_name: distill_t768
seed: 43                      # 换个 seed，避免和 S 学生完全同源

data:
  cache_size: 768
  image_size: 768
  batch_size: 16
  eval_batch_size: 16
  num_workers: 8
  scale: [0.80, 1.0]
  rotate: 7.0
  jitter: 0.2
  erasing: 0.25

model:
  arch: convnext_tiny
  pretrained: true
  drop: 0.3
  drop_path: 0.1
  grad_checkpointing: false

train:
  epochs: 12
  lr: 0.00004
  weight_decay: 0.05
  grad_accum: 2
  grad_clip: 1.0
  warmup_epochs: 1.0
  amp: true
  amp_dtype: bf16
  val_fp32: false
  loss: bce
  pos_weight: false

  distill_alpha: 0.5
  distill_probs: outputs/preds/teacher_train_probs.npy

eval:
  agg: mean
