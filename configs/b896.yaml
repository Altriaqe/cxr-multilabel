# 第六代：ConvNeXt-Base @896（容量翻倍，最后一次冲 78 的机会）
#
# ## 为什么
# 分辨率（896）、预训练（in12k/DINOv3）、蒸馏（3 代）、集成（1/2/3 模型）都已试尽。
# 唯一没在"正确配方"下试过的是**容量**：
#   · S@896（49M）→ 0.8120
#   · B@768（88M）→ 0.8008（但那次用的是 in22k 权重 + 旧增强，配方不对）
#   · **B@896 + 强增强 + 蒸馏** → 从未跑过
#
# ## 交付可行性
# B 的前向约为 S 的 1.8 倍：896 下单模型
#   解码 52 + 缩放 2 + 前向约 34 ≈ 88 ms ✅（只能放一个模型）
#   权重 fp32 334MB（< 500MB）✅
#
# ## 判据
#   ≥0.8165 → 线上约 78.0，直接交这一个（单模型，慢一点但够用）
#   0.8135–0.8165 → 与现有双 896 持平或略好，看线上
#   <0.8130 → 容量不是瓶颈，彻底收工
#
# ## 成本
#   12 轮 × 约 35 分钟 ≈ 7 小时（过夜）

run_name: b896
seed: 150

data:
  cache_size: 896
  image_size: 896
  batch_size: 4
  eval_batch_size: 4
  num_workers: 8
  scale: [0.65, 1.0]
  rotate: 10.0
  jitter: 0.3
  erasing: 0.35
  crop_ratio: [0.85, 1.15]
  ra_ops: 2
  ra_mag: 7

model:
  # convnext_base 没有 in12k_ft_in1k 这个 tag，用 fb_in1k（ImageNet-1k，timm 官方）
  arch: convnext_base.fb_in1k
  pretrained: true
  drop: 0.4
  drop_path: 0.15
  grad_checkpointing: true

train:
  epochs: 12
  lr: 0.00003
  weight_decay: 0.05
  grad_accum: 8
  grad_clip: 1.0
  warmup_epochs: 1.0
  amp: true
  amp_dtype: bf16
  val_fp32: false
  loss: bce
  pos_weight: false

  distill_alpha: 0.9
  distill_probs: outputs/preds/teacher2_train_probs.npy

eval:
  agg: mean
