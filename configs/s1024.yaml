# 第五代：ConvNeXt-S@1024（我们第一次突破 896 分辨率）
#
# ## 为什么
# 分辨率曲线一直是单调上升的：768 → 0.8086，896 → 0.8120（+0.0034）。
# 从没试过 896 以上。1024 是最后一个能装进 100ms 的分辨率档位：
#   解码 52ms（与分辨率无关）+ 缩放 2ms + 前向 26ms ≈ 80ms ✅
#
# ## 为什么只放一个模型
# 1024 下单模型 80ms；两个就 106ms ❌。所以这一跑的目标是：
#   **单模型 ≥ 0.815**，用"更强的一个"替代"两个 896 的集成"（0.8147）。
#
# ## 教师
# 沿用 3×896 集成的软标签（teacher2）。教师不再加强——已有证据表明
# 教师变强（0.8086 → 0.814）时学生没有提升，瓶颈在学生侧。
#
# ## 显存
# 1024 的激活是 896 的 1.31 倍 → batch 从 8 降到 6，梯度累积从 4 提到 6，
# 保持等效 batch ≈ 36 不变。

run_name: s1024
seed: 140

data:
  cache_size: 1024
  image_size: 1024
  batch_size: 6
  eval_batch_size: 6
  num_workers: 8
  scale: [0.65, 1.0]
  rotate: 10.0
  jitter: 0.3
  erasing: 0.35
  crop_ratio: [0.85, 1.15]
  ra_ops: 2
  ra_mag: 7

model:
  arch: convnext_small.in12k_ft_in1k
  pretrained: true
  drop: 0.3
  drop_path: 0.1
  grad_checkpointing: true

train:
  epochs: 12
  lr: 0.00004
  weight_decay: 0.05
  grad_accum: 6
  grad_clip: 1.0
  warmup_epochs: 1.0
  amp: true
  amp_dtype: bf16
  val_fp32: false
  loss: bce
  pos_weight: false

  distill_alpha: 0.9
  distill_probs: outputs/preds/teacher2_train_probs.npy

eval:
  agg: mean
