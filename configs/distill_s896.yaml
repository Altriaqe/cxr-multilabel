# 蒸馏学生 #3：ConvNeXt-S@896（教师 = 9 路集成）
#
# 动机：896 从头训是失败的（0.7993 < 768 的 0.8035），但**蒸馏可能不同**——
#       软标签把"教师认为的概率"直接教给学生，不需要学生自己从像素里重新学分辨率优势。
#       如果蒸馏能把 896 拉到 0.806+，就多一个分辨率维度上的互补成员。
#
# 前置：outputs/preds/teacher_train_probs.npy（10-30 已生成）
# 耗时：896 每轮约 18 分钟 × 12 = 3.6 小时

run_name: distill_s896
seed: 44

data:
  cache_size: 896
  image_size: 896
  batch_size: 8
  eval_batch_size: 8
  num_workers: 8
  scale: [0.80, 1.0]
  rotate: 7.0
  jitter: 0.2
  erasing: 0.25

model:
  arch: convnext_small
  pretrained: true
  drop: 0.3
  drop_path: 0.1
  grad_checkpointing: true

train:
  epochs: 12
  lr: 0.00004
  weight_decay: 0.05
  grad_accum: 4
  grad_clip: 1.0
  warmup_epochs: 1.0
  amp: true
  amp_dtype: bf16
  val_fp32: false
  loss: bce
  pos_weight: false

  distill_alpha: 0.5
  distill_probs: outputs/preds/teacher_train_probs.npy

eval:
  agg: mean
