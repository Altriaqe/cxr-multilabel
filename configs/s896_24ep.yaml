# 第七代：ConvNeXt-S@896，24 轮（验证"轮数是否偏少"）
#
# ## 动机
# 文献在 NIH（112k 图）上普遍用 20–50 轮，我们只用 12 轮。
# 虽然我们做过一次 30 轮实验（long30_s768 → 0.8061，比 12 轮差 0.0025），
# 但那次是在 **768** 分辨率、且没有蒸馏。这次在 896 + 蒸馏 + 强增强下重验。
#
# ## 与 12 轮的关键差异
#   · 调度：warmup_cosine 拉长到 24 轮 → LR 衰减更慢，后期仍有学习率
#   · warmup：1 → 2 轮（长训练需要更稳的起步）
#   · 其余完全不变（同数据、同增强、同教师、同 batch）
#
# ## 判据
#   S@896（12 轮）= 0.8120
#   ≥0.8140 → 轮数确实是瓶颈，可再拉长到 36 轮
#   0.8120–0.8140 → 边际
#   <0.8120 → 12 轮已充分，轮数维度假关闭
#
# ## 成本
#   24 × 约 19.4 分钟 ≈ 7.8 小时

run_name: s896_24ep
seed: 160

data:
  cache_size: 896
  image_size: 896
  batch_size: 8
  eval_batch_size: 8
  num_workers: 8
  scale: [0.65, 1.0]
  rotate: 10.0
  jitter: 0.3
  erasing: 0.35
  crop_ratio: [0.85, 1.15]
  ra_ops: 2
  ra_mag: 7

model:
  arch: convnext_small.in12k_ft_in1k
  pretrained: true
  drop: 0.3
  drop_path: 0.1
  grad_checkpointing: true

train:
  epochs: 24
  lr: 0.00004
  weight_decay: 0.05
  grad_accum: 4
  grad_clip: 1.0
  warmup_epochs: 2.0
  amp: true
  amp_dtype: bf16
  val_fp32: false
  loss: bce
  pos_weight: false

  distill_alpha: 0.9
  distill_probs: outputs/preds/teacher2_train_probs.npy

eval:
  agg: mean
